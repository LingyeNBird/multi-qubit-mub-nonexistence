version: "v0.4"

project:
  name: "Non-Existence of Multi-Qubit Pauli-Covariant MUB Fiducial States and Alltop Phase Functions on F_2^n (n >= 3)"
  description: >-
    Self-contained, pure-kernel Lean 4 formalization proving that for every integer n ≥ 3 (both
    odd and even), no unimodular Alltop phase function exists on 𝔽₂ⁿ and no n-qubit pure state
    generates 2ⁿ pairwise mutually unbiased orthonormal bases under the n-qubit Pauli (product
    Weyl–Heisenberg) group. Resolves Conjecture 1 and the unrestricted product-WH MUB question of
    Damski et al. (arXiv:2603.15550) and rules out the product WH-MUB maximizer mechanism
    conjectured by Liu, Low, and Yin (Quantum Sci. Technol. 11, 015035, 2026; Open Quantum
    Problem E28) for n ≥ 4. Also formalizes sharpness at n = 2, the strong odd-n two-valued
    Pauli-spectrum obstruction, the strict phase-state Gowers U³ bound > 2 - 2⁻ⁿ, and exact
    closed-form Pauli 4th moments for a GL(n, 𝔽₂)-invariant spike+uniform family recovering the
    3-qubit Hoggar SIC (F₃ = 16/9) and certifying a 4-qubit unit state with F₄ < 2.150521.
    AI-assistance disclosure: the bulk of the technical work (proof discovery, Lean 4
    formalization, companion scripts, and manuscript drafting) was carried out using AI systems
    under the author's problem selection, direction, and oversight; mathematical validity of all
    compared theorems rests on Lean 4's kernel verification.
  authors:
    - "Zhaoting Ye"
  license: "MIT"
  responsible_maintainers:
    - "Zhaoting Ye"

