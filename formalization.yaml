fidelity:
  divergences: >-
    IsPauliMubFiducial encodes a fiducial whose 4ⁿ-element Pauli orbit partitions into 2ⁿ pairwise
    mutually unbiased orthonormal bases (extending to 2ⁿ + 1 MUBs with the computational basis for
    equatorial states); partial sets of fewer than 2ⁿ bases are not ruled out. In damski_conjecture_1,
    the normalization factor 2^(-n/2) fixes the missing normalization typo in the printed statement of
    Conjecture 1 in arXiv:2603.15550v2.

review:
