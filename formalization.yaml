  notes: >-
    Not formally peer reviewed. All 10 compared declarations pass Lean 4 pure-kernel verification
    (Audit.lean) and scripts/verify_claims.py passes. On 26 November 2026, the Open Quantum Problems
    catalogue (jpbruneton/open_quantum_problems, issue #26) audited the manuscript, hand-checked the
    odd-n purity argument and Lagrangian lemma, ran verify_claims.py and independent CP¹⁵ restarts,
    and recorded the result on openquantumproblems.com/p/E28 without re-running the Lean build.

