status:
  scope: >-
    Formalizes in full the non-existence of Alltop phase functions on 𝔽₂ⁿ (n ≥ 3), sharpness at
    n = 2, the strict phase-state Gowers U³ bound > 2 - 2⁻ⁿ, the strong odd-n two-valued Pauli
    spectrum obstruction, unrestricted non-existence of n-qubit Pauli-covariant MUB fiducials
    (n ≥ 3) and Damski et al.'s Conjecture 1, sharpness at n = 2, and the closed-form spike+uniform
    Pauli 4th moment including the 3-qubit Hoggar SIC and 4-qubit bound F₄ < 2.150521. The paper's
    general-n analytic derivation that a partition-free two-valued Pauli spectrum forces a
    Lagrangian zero subgroup and the companion C numerical L-BFGS search on CP¹⁵ are not formalized
    in Lean; global optimality of F₄ ≈ 2.150520 on CP¹⁵ remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

